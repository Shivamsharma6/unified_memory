version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uams_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uams_control
      POSTGRES_USER: uams
      POSTGRES_PASSWORD: uams_password
    ports:
      - "5432:5432"
    volumes:
      - uams_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uams -d uams_control"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: uams_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - uams_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  uams-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uams_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      UAMS_DATABASE_URL: "postgresql://uams:uams_password@postgres:5432/uams_control"
      UAMS_QDRANT_HOST: "qdrant"
      UAMS_QDRANT_PORT: "6333"
      UAMS_VAULT_PATH: "/app/vault"
      UAMS_EMBED_PROVIDER: "fake" # Change to 'ollama' or 'fastembed' or 'gemini' for real embeddings
      UAMS_EMBED_DIMENSION: "1024"
    volumes:
      - ./vault:/app/vault
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  uams_pgdata:
  uams_qdrant_data:
