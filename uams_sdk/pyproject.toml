[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uams-sdk"
version = "1.2.0"
description = "Async Python SDK and MCP server for shared, durable AI-agent memory with hybrid retrieval."

readme = "README.md"
authors = [{ name = "Shivam Sharma" }]
requires-python = ">=3.11"
keywords = ["ai agents", "memory", "mcp", "rag", "multi-agent"]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cachetools>=5.3.0",
    "mcp[cli]>=1.12.4,<1.13"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/Shivamsharma6/unified_memory"
Repository = "https://github.com/Shivamsharma6/unified_memory.git"
Documentation = "https://github.com/Shivamsharma6/unified_memory#readme"
Issues = "https://github.com/Shivamsharma6/unified_memory/issues"

[project.scripts]
uams-mcp = "uams_sdk.mcp_server:main"
uams-demo = "uams_sdk.demo:main"


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]
